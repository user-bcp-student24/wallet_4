quarkus.application.name=wallet-backend
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.test-port=0
quarkus.jackson.fail-on-unknown-properties=false
quarkus.smallrye-openapi.info-title=Wallet Backend
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
mp.openapi.scan.packages=pe.wallet.infrastructure.rest
%dev.quarkus.swagger-ui.always-include=true

wallet.environment=${WALLET_ENVIRONMENT:local}
wallet.mock.latency-ms=${WALLET_MOCK_LATENCY_MS:0}
wallet.mock.root-url=${WALLET_MOCK_ROOT_URL:https://bcp-wallet-mock.yefri.workers.dev}
quarkus.rest-client.wallet-mock.url=${WALLET_MOCK_URL:https://bcp-wallet-mock.yefri.workers.dev/groups/4}
quarkus.rest-client.wallet-mock.connect-timeout=2000
quarkus.rest-client.wallet-mock.read-timeout=5000
quarkus.rest-client.wallet-mock.connection-pool-size=20
quarkus.rest-client.wallet-mock.keep-alive-enabled=true
quarkus.rest-client.wallet-mock.logging.scope=none

%test.wallet.environment=test
%test.quarkus.rest-client.wallet-mock.url=http://127.0.0.1:1
%test.wallet.mock.root-url=http://127.0.0.1:1